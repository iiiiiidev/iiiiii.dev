<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>repos | iiiiii.dev</title>
  <meta name="description" content="my repos">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="header">
    <img class="pfp" src="https://avatars.githubusercontent.com/u/131040222?v=4" alt="pfp">
    <h1>i</h1>
  </div>
  <div class="tree">
    <span class="tree-root">iiiiiidev/</span>
    <ul id="repo-list">
      <li><span class="tree-pipe">|</span> loading...</li>
    </ul>
    <a class="tree-back" href="index.html">&lt;- back</a>
  </div>
  <script>
    fetch('https://api.github.com/users/iiiiiidev/repos?sort=updated&per_page=100')
      .then(res => {
        if (!res.ok) throw new Error(res.status);
        return res.json();
      })
      .then(repos => {
        const list = document.getElementById('repo-list');
        list.innerHTML = '';
        for (const repo of repos) {
          const li = document.createElement('li');
          const pipe = document.createElement('span');
          pipe.className = 'tree-pipe';
          pipe.textContent = '|';
          const link = document.createElement('a');
          link.href = repo.html_url;
          link.textContent = repo.name;
          li.append(pipe, ' ', link);
          list.appendChild(li);
        }
      })
      .catch(() => {
        document.getElementById('repo-list').innerHTML =
          '<li><span class="tree-pipe">|</span> couldn\'t load repos :(</li>';
      });
  </script>
  <script src="oneko.js"></script>
</body>
</html>
